version: 1
frontend:
  phases:
    preBuild:
      commands:
        - python3 --version
        - python3 -m pip install --user --quiet --disable-pip-version-check pillow
    build:
      commands:
        - python3 source/build.py
  artifacts:
    baseDirectory: site
    files:
      - '**/*'
  cache:
    paths: []
